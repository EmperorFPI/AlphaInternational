<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha International — Coming Soon</title>
<meta name="description" content="Alpha International. Our new site is under construction and launching soon.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14181D">

<meta property="og:type" content="website">
<meta property="og:title" content="Alpha International — Coming Soon">
<meta property="og:description" content="Our new site is under construction and launching soon.">
<meta property="og:image" content="assets/logo.png">

<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #14181D;
    --bg-lift: #1B2027;
    --accent: #2B9ADB;
    --accent-deep: #1E7EC1;
    --text: #F2F5F8;
    --text-dim: #93A1B0;
    --rule: rgba(255, 255, 255, 0.10);
    --gutter: 16px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-weight: 400;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Soft blue wash behind the mark, plus a faint grid for depth. */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(60rem 40rem at 50% 12%, rgba(43, 154, 219, 0.16), transparent 70%),
      radial-gradient(40rem 30rem at 85% 95%, rgba(30, 126, 193, 0.10), transparent 70%);
  }

  .backdrop::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: 0.35;
    mask-image: radial-gradient(70% 60% at 50% 40%, #000 20%, transparent 100%);
    -webkit-mask-image: radial-gradient(70% 60% at 50% 40%, #000 20%, transparent 100%);
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 56px var(--gutter);
  }

  .logo {
    width: min(560px, 100%);
    height: auto;
    display: block;
    margin-bottom: 40px;
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 20px;
    padding: 7px 16px 7px 13px;
    border: 1px solid rgba(43, 154, 219, 0.35);
    border-radius: 999px;
    background: rgba(43, 154, 219, 0.08);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
  }

  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(43, 154, 219, 0.7);
    animation: pulse 2.2s ease-out infinite;
  }

  h1 {
    margin: 0 0 18px;
    font-size: clamp(1.9rem, 6vw, 3.25rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.15;
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
  }

  h1 .accent { color: var(--accent); }

  .lede {
    margin: 0 auto 36px;
    max-width: 52ch;
    color: var(--text-dim);
    font-size: clamp(0.98rem, 2.4vw, 1.1rem);
    font-weight: 300;
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both;
  }

  .track {
    width: min(420px, 100%);
    height: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.36s both;
  }

  .track span {
    display: block;
    width: 38%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent-deep), transparent);
    animation: sweep 2.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  .contact {
    margin: 36px 0 0;
    font-size: 0.95rem;
    color: var(--text-dim);
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.44s both;
  }

  .contact a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(43, 154, 219, 0.35);
    padding-bottom: 1px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    color: #6FBDEC;
    border-color: #6FBDEC;
  }

  footer {
    position: relative;
    z-index: 1;
    padding: 24px var(--gutter) 32px;
    border-top: 1px solid var(--rule);
    color: #6C7A88;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-align: center;
  }

  a:focus-visible,
  .track:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 3px;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes sweep {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(370%); }
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(43, 154, 219, 0.65); }
    70%  { box-shadow: 0 0 0 9px rgba(43, 154, 219, 0); }
    100% { box-shadow: 0 0 0 0 rgba(43, 154, 219, 0); }
  }

  @media (max-width: 480px) {
    .logo { margin-bottom: 28px; }
    main { padding: 40px var(--gutter); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .track span { width: 100%; }
  }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <main>
    <img class="logo" src="assets/logo.png" alt="Alpha International" width="2640" height="840">

    <p class="eyebrow"><span class="pulse" aria-hidden="true"></span>Under Construction</p>

    <h1>Something <span class="accent">strong</span> is being built.</h1>

    <p class="lede">
      Our new home online is in development. We're putting the finishing touches
      on it now &mdash; check back shortly.
    </p>

    <div class="track" role="img" aria-label="Site in progress">
      <span></span>
    </div>

    <p class="contact">
      In the meantime, reach us at
      <a href="mailto:info@alphainternational.com">info@alphainternational.com</a>
    </p>
  </main>

  <footer>
    &copy; <span id="year">2026</span> Alpha International. All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
